{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <title>Band trainer</title>
  <link rel="stylesheet" href="{% static 'player/css/base.css' %}">
  <link rel="stylesheet" href="{% static 'player/css/index.css' %}">
</head>
<body>
  <div class="aspect-overlay" id="aspectOverlay">
    <h2>Please rotate or resize!</h2>
    <p>Make your window wider, or rotate your phone into landscape orientation to use this app.</p>
  </div>

  <div class="Box" id="InnerBox">
    <h2 class="AnswerIndicator" id="AnswerIndicator">Which sample matches reference X?</h2>
    <h3 class="TaskDescription">Play X, A and B - pick whether A or B is identical to the reference.</h3>
    <h3 class="status" id="status">READY</h3>
    <p class="TaskDescription" id="score">Score: 0 / 0 (0%)</p>
    <div class="bottom-controls">
      <button type="button" id="PlayXBtn" class="PlayStopBtn">Play X</button>
      <button type="button" id="PlayABtn" class="PlayStopBtn">Play A</button>
      <button type="button" id="PlayBBtn" class="PlayStopBtn">Play B</button>
      <div class="file-selector-group">
        <select class="file-selector" id="fileSelector">
          <option value="Gray_noise.wav" selected>Gray_noise.wav</option>
          <option value="sample.wav">sample.wav</option>
        </select>
        <p class="file-selector-desc">audio source</p>
      </div>
      <button type="button" id="SubmitNextBtn" class="SubmitNextBtn">Submit answer</button>
    </div>

        <ul class="radioList">
            <li class="radioLi">
                <input type="radio" id="ansA" name="answer" value="A">
                <label for="ansA">A = X</label>
            </li>
            <li class="radioLi">
                <input type="radio" id="ansB" name="answer" value="B">
                <label for="ansB">B = X</label>
            </li>
        </ul>
  </div>

  <script>
    // === DOM REFERENCES ===
    const AnsIndicator  = document.getElementById('AnswerIndicator');
    const PlayXBtn      = document.getElementById('PlayXBtn');
    const PlayABtn      = document.getElementById('PlayABtn');
    const PlayBBtn      = document.getElementById('PlayBBtn');
    const SubmitNextBtn = document.getElementById('SubmitNextBtn');
    const InnerBox      = document.getElementById('InnerBox');
    const statusEl      = document.getElementById('status');
    const fileSelector  = document.getElementById('fileSelector');
    const scoreEl       = document.getElementById('score');

    let audioCtx;
    let audioBuffer = null;
    let currentSource = null;
    let currentLabel = null;
    let round = null; 
    let matchVersion = null;
    let score = 0;
    let attempts = 0;

    const bandfilterPairs = [[0,44000],[50,18000],[70,16000],[90,14000],[110,12000],[140,10000],[200,8000],[250,6500]]; // pary z OJD lab 1

    // Load audio from Django once per selector change
    async function loadAudioFile(filename) {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        stopPlayback();

        const url = `/bandwidth-trainer/?file=${encodeURIComponent(filename)}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Failed to load audio: ' + resp.statusText);
        const arrayBuffer = await resp.arrayBuffer();
        audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
    }

        fileSelector.addEventListener('change', (e) => {
            loadAudioFile(e.target.value).catch(err => {
                setStatus('ERROR: ' + err.message, 'error');
            });
        });
    
        loadAudioFile(fileSelector.value).catch(err => {
            setStatus('ERROR: ' + err.message, 'error');
        });

    
    function CreateNewBandwidthTest() {
        const i = Math.floor(Math.random() * bandfilterPairs.length);
        let   j = Math.floor(Math.random() * bandfilterPairs.length);
        while (j === i) j = Math.floor(Math.random() * bandfilterPairs.length);
        const ref = bandfilterPairs[i], alt = bandfilterPairs[j];
        matchVersion = Math.random() < 0.5 ? 'A' : 'B';
        round = {
            X: ref,
            A: matchVersion === 'A' ? ref : alt,
            B: matchVersion === 'B' ? ref : alt,
        };
    }
    // https://developer.mozilla.org/en-US/docs/Web/API/BiquadFilterNode
    function playSample(pair, label, btn) {
        if (currentLabel === label) { stopPlayback(); return; }  
        stopPlayback();
        if (!audioBuffer) {
            setStatus('Audio not loaded yet, please wait...', 'error');
            return;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const [lowFreq, highFreq] = pair;
        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.loop = true;

        const highpass = audioCtx.createBiquadFilter();
        highpass.type = 'highpass';
        highpass.frequency.value = lowFreq;
        highpass.Q.value = 0.7071;

        const lowpass = audioCtx.createBiquadFilter();
        lowpass.type = 'lowpass';
        lowpass.frequency.value = highFreq;
        lowpass.Q.value = 0.7071;

        source.connect(highpass).connect(lowpass).connect(audioCtx.destination);
        source.start();

        currentSource = source;
        currentLabel = label;
        btn.textContent = 'Stop ' + label;
        setStatus('PLAYING ' + label);
    }

    function fmtBand(pair) {
      const [low, high] = pair;
      return low + '–' + high + ' Hz';
    }

    function updateScore() {
      const pct = attempts ? Math.round((score / attempts) * 100) : 0;
      scoreEl.textContent = "Score: " + score + " / " + attempts + " (" + pct + "%)";
    }

    // === SUBMIT ===
    function submit() {
      stopPlayback();

      const selected = document.querySelector('input[name="answer"]:checked');

      if (selected == null) {
        AnsIndicator.textContent   = "You must select an answer before submitting.";
        AnsIndicator.style.color   = "";              // keep default text color
        InnerBox.style.borderColor = "#d4b800";
        InnerBox.style.background  = "rgba(212,184,0,0.10)";
        SubmitNextBtn.addEventListener('click', submit, { once: true });
        return;
      }

      attempts++;

      const other = matchVersion === 'A' ? 'B' : 'A';

      if (selected.value === matchVersion) {
        score++;
        AnsIndicator.textContent   = "Correct! X = " + matchVersion + " (band " + fmtBand(round.X) + "). Odd one was " + other + " (" + fmtBand(round[other]) + ").";
        AnsIndicator.style.color   = "var(--accent2)"; // use CSS variable for consistency
        InnerBox.style.borderColor = "var(--accent2)";
        InnerBox.style.background  = "rgba(129,244,149,0.10)";
        statusEl.style.color       = "var(--accent2)";
      } else {
        AnsIndicator.textContent   = "Incorrect :( X = " + matchVersion + " (band " + fmtBand(round.X) + "). You picked " + selected.value + " (" + fmtBand(round[selected.value]) + ").";
        AnsIndicator.style.color   = "var(--wrong-light)";
        InnerBox.style.borderColor = "var(--wrong-hard)";
        InnerBox.style.background  = "rgba(255,111,89,0.10)";
        statusEl.style.color       = "var(--wrong-light)";
      }

      updateScore();

      //Disable radios
      document.querySelectorAll('input[name="answer"]').forEach(function(radio) { radio.disabled = true; });

      SubmitNextBtn.textContent = "Next";
      SubmitNextBtn.addEventListener('click', next, { once: true });
    }

    function next() {
      stopPlayback();

      CreateNewBandwidthTest();
      document.querySelectorAll('input[name="answer"]').forEach(function(radio) { radio.disabled = false; radio.checked = false; });

      AnsIndicator.textContent = "Which sample matches reference X?";
      AnsIndicator.style.color = "";              

      SubmitNextBtn.textContent = "Submit";
      SubmitNextBtn.addEventListener('click', submit, { once: true });
      InnerBox.style.borderColor = "";
      InnerBox.style.background  = "";
      statusEl.style.color = "";
    }


    SubmitNextBtn.addEventListener('click', submit, { once: true });

    // === STATUS HELPER ===
    function setStatus(msg, cls = '') {
      statusEl.textContent = msg;
      statusEl.className   = 'status ' + cls;
    }

    // === STOP PLAYBACK ===
    function stopPlayback() {
      if (currentSource) {
        currentSource.onended = null;
        try { currentSource.stop(); } catch (e) {}
        currentSource = null;
      }
      currentLabel = null;
      PlayXBtn.textContent = "Play X";
      PlayABtn.textContent = "Play A";
      PlayBBtn.textContent = "Play B";
      setStatus('READY');
    }

    // === PLAY / STOP ===
    PlayXBtn.addEventListener('click', () => playSample(round.X, 'X', PlayXBtn));
    PlayABtn.addEventListener('click', () => playSample(round.A, 'A', PlayABtn));
    PlayBBtn.addEventListener('click', () => playSample(round.B, 'B', PlayBBtn));

    CreateNewBandwidthTest();
  </script>
</body>
</html>
